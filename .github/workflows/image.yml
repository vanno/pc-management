# Construit l'image du worker à chaque fusion dans main et la publie sur
# GitHub Container Registry. Le NAS la récupère seul la nuit
# (scripts/maj-nas.sh, tâche planifiée DSM) : plus de ZIP à copier.
name: Image du worker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tests du worker
        working-directory: worker
        run: python3 -m unittest discover -s tests

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Le DS920+ (Celeron J4125) est en x86_64 : une seule plateforme.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/vanno/pc-management:latest
            ghcr.io/vanno/pc-management:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/vanno/pc-management
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
